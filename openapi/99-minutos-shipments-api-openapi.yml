                    errors: {}
                  summary: Tracking status
                  description: Tracking status response
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequest'
              examples:
                TooManyRequests:
                  value: 'HTTP/1.1 429 Too Many RequestsContent-type: text/htmlRetry-After: 3600'
                  summary: Too many requests
                  description: if you are thinking of implementing a recurring pull system on this endpoint, you must limit requests to a maximum of 8 per second.
          description: ''
  /api/v3/shipments/tracking/batch:
    get:
      operationId: shipments_tracking_batch_retrieve
      description: 'Batch tracking can add multiple identifiers of the following format -->  `/api/v3/shipments/tracking/batch?identifiers={trackingId}&identifiers={trackingId}`


        Track a shipment by the given identifier. Get all information about the shipments with the related events and data. **Remember that if you are thinking of implementing a recurring pull system on this endpoint, you must limit requests to a maximum of 8 per second. However, we also offer a real-time webhook notification system so you get every change in the status of the shipments, which is more efficient than pulling. For more information go to the webhooks section**


        | **STATUS CODE** | **STATUS NAME** | **DESCRIPTION** |

        | --- | --- | --- |

        | 1001 | DRAFT | It is the first status when the shipment is created `in draft mode`. It means that the shipment is not yet ready by the client and its flow will not start until it is confirmed. Note that the draft value is passed when creating the order and defaults to false. Therefore, this status is only passed through if the draft was previously set to true when creating the order. |

        | 1002 | CONFIRMED | The shipment has been confirmed. It is the first status to trigger the logistics operation. It is the first default state when creating an order (false draft) or when confirming a shipment that was previously created as a draft. |

        | 2002 | ON_ROAD_TO_PICKUP | The shipment is on its way to be picked up. So a driver is heading to the point of origin. *`Does not apply to p99`* |

        | 2003 | COLLECTED | The shipment has been collected and is in the domain of an associated driver of 99minutos. |

        | 2101 | UNSUCCESSFUL_PICKUP | The shipment could not be collected. Within the response object, the attempt attribute is added with the number of collection attempts. `See examples` |

        | 3001 | STORED | The shipment is stored in a wharehouse for 99minutos. |

        | 3004 | ON_LINEHAUL | The shipment is in transit between stations for 99minutos `Not all shipments go through this state.` |

        | 4001 | ON_ROAD_TO_DELIVERY | The shipment has left the network of 99minutos stations to the final destination |

        | 4002 | DELIVERED | The shipment has been successfully delivered to its recipient |

        | 4101 | UNSUCCESSFUL_DELIVERY | The shipment could not be delivered. Inside the response object, the attempt attribute is added with the number of delivery attempts. `See examples` |

        | 5001 | ON_ROAD_TO_RETURN | Shipping on the way to return. The return occurs when it is not possible to deliver the package to the recipient and it is returned to the origin |

        | 5002 | RETURNED | The shipment has been returned to the origin successfully |

        | 5101 | UNSUCCESSFUL_RETURN | The shipment could not be returned. Inside the response object, the attempt attribute is added with the number of return attempts. `See examples` |

        | 7101 | IN_CORRECTION | In some cases the information of origin, destination, etc. may not be precise enough to make the shipment. Therefore, this status indicates that some information of the shipment must be corrected. |

        | 7102 | CORRECTED | If the shipment required correction, it indicates that this has already been done. |

        | 8001 | STOLEN | In extremely rare cases for reasons other than 99minutos the shipment is stolen. `This is extremely rare.` |

        | 8003 | CANCELLED | The shipment has been canceled via API by the client |

        | 8004 | DAMAGED | The shipment was damaged during delivery. |'
      parameters:
      - in: query
        name: identifiers
        schema:
          type: integer
          format: int64
        description: The identifier represent a internalKey or trackingId of one shipment.
      tags:
      - shipments
      security:
      - AuthJWT: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackingBatchResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequest'
              examples:
                TooManyRequests:
                  value: 'HTTP/1.1 429 Too Many RequestsContent-type: text/htmlRetry-After: 3600'
                  summary: Too many requests
                  description: if you are thinking of implementing a recurring pull system on this endpoint, you must limit requests to a maximum of 8 per second.
          description: ''
components:
  schemas:
    DeliveryType2faEnum:
      enum:
      - SMD
      - SPT
      - 99M
      - CO2F
      - RET
      - NAL
      - P2P
      type: string
    CurrencyEnum:
      enum:
      - COP
      - MXN
      - CLP
      - PEN
      - ARP
      type: string
    Payment:
      type: object
      description: Payment options are included in this section
      properties:
        insured:
          type: boolean
        insuredValue:
          type: number
          format: double
          description: Amount in local currency for which the shipment will be insured. The shipment will be insured in case of damage, loss, theft. Extra fees could be applied, check with your support agent.
        cashOnDelivery:
          allOf:
          - $ref: '#/components/schemas/Embedded'
          description: Cash on delivery (COD) applies to shipments paid by the recipient in cash at the time of delivery. If it is not sent in the payload, it is assumed that this does not happen, otherwise the amount and currency fields must be included
    Option:
      type: object
      description: Options to customize the shipment.
      properties:
        pickUpAfter:
          type: string
          format: date-time
          description: Date time from which the shipment is available for pickup
        deliveryBetween:
          type: object
          additionalProperties:
            type: string
            format: date-time
        requiresIdentification:
          type: boolean
        requiresSignature:
          type: boolean
        twoFactorAuth:
          type: boolean
          description: Code is required to mark the order as delivered. Needs to be activated previously
        notes:
          type: string
          description: Notes that will be displayed on the label
    PatchedShipmentUpdate:
      type: object
      description: 'Update shipment serializer.

        Only the origin and destination fields can be updated.

        The deliveryType is not in read only fields because

        is required for the covered'
      properties:
        destination:
          $ref: '#/components/schemas/Location'
      x-examples:
        Example update order destination:
          destination:
            address: Cda. de Guaymas 8, Roma Nte., Cuauhtémoc, 06700 Ciudad de México, CDMX, Mexico
            country: MEX
            reference: Torre 3 Apartamente 905
            zipcode: '15900'
    Event:
      type: object
      properties:
        statusCode:
          allOf:
          - $ref: '#/components/schemas/StatusCodeEnum'
        statusName:
          allOf:
          - $ref: '#/components/schemas/StatusNameEnum'
        data:
          type: object
          additionalProperties: {}
          readOnly: true
        metadata:
          type: object
          additionalProperties: {}
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - statusCode
      - statusName
      - data
      - metadata
      - createdAt
    Sender:
      type: object
      description: Person who will receive the shipment.
      properties:
        firstName:
          type: string
          description: Name of the person receiving or sending the shipment.
        lastName:
          type: string
          description: Last name of the person receiving or sending the shipment.
        phone:
          type: string
          description: Phone of the person receiving or sending the shipment. Must include the international code (+52, +51)
          example: '+525547596221'
        email:
          type: string
          format: email
          description: Email of the person receiving or sending the shipment.
      required:
      - firstName
      - lastName
      - phone
      - email
    TrackingBatchResponse:
      type: object
      properties:
        traceId:
          type: string
          example: c0510fb7-0e73-4cc1-8f0b-f1ae632d2bd6
        message:
          type: string
          example: OK
        data:
          type: array
          items:
            type: object
            properties:
              trackingId:
                type: string
                example: '2763022166'
              events:
                type: array
                items:
                  type: object
                  properties:
                    statusCode:
                      type: string
                      example: '8003'
                    statusName:
                      type: string
                      example: CANCELLED
                    data:
                      type: object
                      properties:
                        comment:
                          type: string
                          example: ''
                    metadata:
                      type: object
                    createdAt:
                      type: string
                      format: date-time
                      example: '2023-08-21T23:18:23.979000-05:00'
    TrackingResponse:
      type: object
      properties:
        traceId:
          type: string
          readOnly: true
        message:
          type: string
          readOnly: true
        data:
          $ref: '#/components/schemas/Event'
        errors:
          type: object
          additionalProperties: {}
          readOnly: true
      required:
      - data
      - errors
      - message
      - traceId
      description: ''
    Location:
      type: object
      description: 'Location where the package is picked up.

        Depending on the flow you choose,

        you must send different parameters.


        A location is a geographical point that can be taken as the origin and/or destination of a shipment.


        There are 3 ways in which you can define a location, feel free to choose the one that best suits your business rules.

        Each one is described below.


        1. Coords-based

        It is the option with the best precision to define an origin or destination.

        Latitude and longitude are taken to define the location


        2. LocationId-based

        A LocationId is a uuid that identifies a single geographic point.

        The locationId is generated by this API (check out the Get Location id request in Locations folder).

        By using locationId, no further data needs to be passed.

        It is useful when you have the same point in several shipments since you can reuse the locationId.


        3. Address string-based

        In this option the client sends only the address. We will process the address to obtain the other data.


        However, if the address does not contain information necessary to locate it,

        the system will return a 400 error and the order will not be created, so you must handle the error.


        It is important to emphasize that in the two previous flows there is no possibility to reject an order for the location'
      properties:
        locationId:
          type: string
          format: uuid
          description: LocationId is a uuid that identifies a single geographic point.
        lat:
          type: number
          format: double
          maximum: 90
          minimum: -90
          description: Longitude coordinates
        lng:
          type: number
          format: double
          maximum: 180
          minimum: -180
          description: Lattitude coordinates
        address:
          type: string
          description: Text sentence that references the location. This address will be printed on the labels.
        country:
          allOf:
          - $ref: '#/components/schemas/LocationCountryEnum'
        reference:
          type: string
          description: Any other text that enrich the address of the location such apartment, Suite, Box number, Tower, etc.
        zipcode:
          type: string
          description: Location zipcode. If it is not included we will try to extract the zipcode from the address. So if your address does not include zipcode, you must include it in this field
          nullable: true
        city:
          type: string
          description: Text that reference the city of the location
    Item:
      type: object
      description: Array of items/packages to send.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        size:
          $ref: '#/components/schemas/ItemSizeEnum'
        description:
          type: string
        weight:
          type: integer
          minimum: 1
          description: Measurement in grams of weight
        length:
          type: integer
          minimum: 1
          description: Horizontal measurement in centimeters take from one end to the other of the longer or longest side of an object
        width:
          type: integer
          minimum: 1
          description: Horizontal measurement in centimeters taken from one end to the other of theshorter or shortest side of an object
        height:
          type: integer
          minimum: 1
          description: Vertical measure in centimeters of distance from base to top
      required:
      - id
      - size
      - weight
    TooManyRequest:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    Recipient:
      type: object
      description: Person who will receive the shipment.
      properties:
        firstName:
          type: string
          description: Name of the person receiving or sending the shipment.
        lastName:
          type: string
          description: Last name of the person receiving or sending the shipment.
        phone:
          type: string
          description: Phone of the person receiving or sending the shipment. Must include the international code (+52, +51)
          example: '+525547596221'
        email:
          type: string
          format: email
          description: Email of the person receiving or sending the shipment.
      required:
      - firstName
      - lastName
      - phone
      - email
    ItemSizeEnum:
      enum:
      - xs
      - s
      - m
      - l
      - xl
      - xxl
      - unknown
      - '-'
      type: string
    Embedded:
      type: object
      description: 'Serializer for EmbeddedDocuments.


        Skips id field and uniqueness validation.

        When saving, skips calling instance.save'
      properties:
        amount:
          type: number
          format: double
        currency:
          $ref: '#/components/schemas/CurrencyEnum'
      required:
      - amount
      - currency
    LocationCountryEnum:
      enum:
      - MEX
      - COL
      - CHL
      - PER
      type: string
    StatusNameEnum:
      enum:
      - SHIPMENT_TO_BE_CONFIRMED
      - CONFIRMED
      - ON_ROAD_TO_PICKUP
      - COLLECTED
      - UNSUCCESSFUL_PICKUP
      - STORED
      - ON_LINEHAUL
      - ON_ROAD_TO_DELIVERY
      - DELIVERED
      - UNSUCCESSFUL_DELIVERY
      - ON_ROAD_TO_RETURN
      - RETURNED
      - UNSUCCESSFUL_RETURN
      - IN_CORRECTION
      - CORRECTED
      - STOLEN
      - CANCELLED
      - DAMAGED
      type: string
    StatusCodeEnum:
      enum:
      - '1001'
      - '1002'
      - '2002'
      - '2003'
      - '2101'
      - '3001'
      - '3004'
      - '4001'
      - '4002'
      - '4101'
      - '5001'
      - '5002'
      - '5101'
      - '7101'
      - '7102'
      - '8001'
      - '8003'
