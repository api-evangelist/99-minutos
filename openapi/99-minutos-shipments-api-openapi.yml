openapi: 3.0.3
info:
  title: API Version 3 coverage shipments API
  version: 3.0.0
  description: "This is the documentation for the public api *(version 3)* of 99minutos. [https://www.99minutos.com/.](https://www.99minutos.com/.EnvironmentAPI)\n\n# First Steps\n\n1.  Create an account in the sandbox website: [https://delivery-git-sandbox-99minutos.vercel.app/](https://delivery-git-sandbox-99minutos.vercel.app/)\n2.  Go to Developers section\n3.  On API Keys V3 section click on `Generar`\n4.  After this the `client_id` and `client_secret` will be displayed\n    \n\nUse the credentials to generate access tokens as shown below in the endpoint `create access token`\n\nFollow the same process in production.\n\n## Environments\n\n| **Environment** | **Website** | **API url** |\n| --- | --- | --- |\n| Sandbox | [https://delivery-git-sandbox-99minutos.vercel.app/](https://delivery-git-sandbox-99minutos.vercel.app/) | [https://sandbox.99minutos.com](https://sandbox.99minutos.com) |\n| Production | [https://envios.99minutos.com/developers](https://envios.99minutos.com/developers) | [https://delivery.99minutos.com](https://delivery.99minutos.com) |\n\n`Each environment has an independent set of credentials`"
servers:
- url: https://delivery.99minutos.com
  description: Produccion
- url: https://sandbox.99minutos.com
  description: Sandbox Environment
tags:
- name: shipments
paths:
  /api/v3/shipments/{id}:
    parameters:
    - schema:
        type: string
      name: id
      in: path
      required: true
      description: trackingId or internalKey
    get:
      summary: ''
      tags:
      - shipments
      responses:
        '200':
          $ref: '#/components/responses/ShipmentDetailResponse'
      operationId: get-api-v3-shipments-id
      description: Return a shipment given an trackingId or internalKey
      security:
      - AuthJWT: []
    patch:
      operationId: shipments_partial_update
      description: 'Update the destination address of a shipment. The shipment must be in one of the following statuses:


        DRAFT

        CONFIRMED

        UNSUCCESSFULLPICKUP

        ONROADTOPICKUP

        COLLECTED

        STORED'
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - shipments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedShipmentUpdate'
            examples:
              Payload example:
                value:
                  destination:
                    address: Cda. de Guaymas 8, Roma Nte., Cuauhtémoc, 06700 Ciudad de México, CDMX, Mexico
                    country: MEX
                    reference: Torre 3 Apartamente 905
                    zipcode: '15900'
        description: ''
      security:
      - AuthJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentUpdate'
              examples:
                Example response:
                  value:
                    traceId: ad050ab1-9344-4753-b2ce-d5a218de14f8
                    message: OK
                    data:
                      sender:
                        firstName: Esteban
                        lastName: Ramirez
                        phone: '+52999999999'
                        email: esteban@gmail.com
                      recipient:
                        firstName: Carlos
                        lastName: Gonzalez
                        phone: '+52999999999'
                        email: esteban@gmail.com
                      origin:
                        locationId: 2753165a-c300-4710-ad69-a7a766a939c2
                        lat: 19.410353
                        lng: -99.09836
                        address: Av. del Taller 452, Jardín Balbuena, Álvaro Obregón, 15900 Ciudad de México, CDMX, México
                        country: MEX
                        type: private
                        reference: Primer Piso
                        zipcode: '15900'
                      destination:
                        locationId: d20f80ab-ce65-4424-a359-04b9ba6b48f5
                        lat: 19.425213
                        lng: -99.153984
                        address: Cda. de Guaymas 8, Roma Nte., Cuauhtémoc, 06700 Ciudad de México, CDMX, Mexico
                        country: MEX
                        type: private
                        reference: Torre 3 Apartamente 905
                        zipcode: '15900'
                      payments:
                        paymentMethod: cash
                        cashOnDelivery:
                          amount: 100
                          currency: MXN
                      options:
                        pickUpAfter: '2022-10-24T23:22:51.057000'
                        deliveryBetween: {}
                        notes: '**Information to be printed on the label**'
                      items:
                      - id: e034e8e4-4f35-4156-be4b-7b9cac4e4224
                        size: l
                        description: This is the description
                        weight: 1000
                        length: 50
                        width: 30
                        height: 20
                      id: aFqvmecyn29mAJ182qnS6vo1kLDtoKYi
                      internalKey: 1f5907e6-ae32-4c98-98e7-6f5bc8d2da82
                      deliveryType: SPT
                      trackingId: 2753512370
                      deactivated: false
                    errors: ''
          description: ''
    delete:
      summary: ''
      operationId: delete-api-v3-shipments-id
      description: Cancels an order by trackingId or internalKey.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              x-examples:
                Example 1:
                  reason: Lorem impsm
              properties:
                reason:
                  type: string
                  description: Reason for cancellation
              required:
              - reason
            examples:
              Reason Cancellation example:
                value:
                  reason: El cliente canceló
        description: Must provide a reason
      tags:
      - shipments
      responses:
        '200':
          $ref: '#/components/responses/ShipmentDeactiveResponse'
      parameters:
      - schema:
          type: string
          enum:
          - trackingId
          - internalKey
          example: trackingId
        in: query
        name: by
        description: specifies whether the order is to be searched by trackingId or internalKey
      security:
      - AuthJWT: []
  /api/v3/shipments/tracking:
    get:
      operationId: shipments_tracking_retrieve
      description: 'Track a shipment by the given identifier. Get all information about the shipments with the related events and data. **Remember that if you are thinking of implementing a recurring pull system on this endpoint, you must limit requests to a maximum of 8 per second. However, we also offer a real-time webhook notification system so you get every change in the status of the shipments, which is more efficient than pulling. For more information go to the webhooks section**


        | **STATUS CODE** | **STATUS NAME** | **DESCRIPTION** |

        | --- | --- | --- |

        | 1001 | DRAFT | It is the first status when the shipment is created `in draft mode`. It means that the shipment is not yet ready by the client and its flow will not start until it is confirmed. Note that the draft value is passed when creating the order and defaults to false. Therefore, this status is only passed through if the draft was previously set to true when creating the order. |

        | 1002 | CONFIRMED | The shipment has been confirmed. It is the first status to trigger the logistics operation. It is the first default state when creating an order (false draft) or when confirming a shipment that was previously created as a draft. |

        | 2002 | ON_ROAD_TO_PICKUP | The shipment is on its way to be picked up. So a driver is heading to the point of origin. *`Does not apply to p99`* |

        | 2003 | COLLECTED | The shipment has been collected and is in the domain of an associated driver of 99minutos. |

        | 2101 | UNSUCCESSFUL_PICKUP | The shipment could not be collected. Within the response object, the attempt attribute is added with the number of collection attempts. `See examples` |

        | 3001 | STORED | The shipment is stored in a wharehouse for 99minutos. |

        | 3004 | ON_LINEHAUL | The shipment is in transit between stations for 99minutos `Not all shipments go through this state.` |

        | 4001 | ON_ROAD_TO_DELIVERY | The shipment has left the network of 99minutos stations to the final destination |

        | 4002 | DELIVERED | The shipment has been successfully delivered to its recipient |

        | 4101 | UNSUCCESSFUL_DELIVERY | The shipment could not be delivered. Inside the response object, the attempt attribute is added with the number of delivery attempts. `See examples` |

        | 5001 | ON_ROAD_TO_RETURN | Shipping on the way to return. The return occurs when it is not possible to deliver the package to the recipient and it is returned to the origin |

        | 5002 | RETURNED | The shipment has been returned to the origin successfully |

        | 5101 | UNSUCCESSFUL_RETURN | The shipment could not be returned. Inside the response object, the attempt attribute is added with the number of return attempts. `See examples` |

        | 7101 | IN_CORRECTION | In some cases the information of origin, destination, etc. may not be precise enough to make the shipment. Therefore, this status indicates that some information of the shipment must be corrected. |

        | 7102 | CORRECTED | If the shipment required correction, it indicates that this has already been done. |

        | 8001 | STOLEN | In extremely rare cases for reasons other than 99minutos the shipment is stolen. `This is extremely rare.` |

        | 8003 | CANCELLED | The shipment has been canceled via API by the client |

        | 8004 | DAMAGED | The shipment was damaged during delivery. |'
      parameters:
      - in: query
        name: identifier
        schema:
          type: integer
          format: int64
        description: The identifier represent a internalKey or trackingId of one shipment.
      tags:
      - shipments
      security:
      - AuthJWT: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackingResponse'
              examples:
                TrackingStatus:
                  value:
                    traceId: 73801b36-15d9-4bc2-9874-06772578ad95
                    message: Shipment found.
                    data:
                      events:
                      - statusCode: '1002'
                        statusName: CONFIRMED
                        data: {}
                        metadata: {}
                        createdAt: '2021-12-20 07:30:23'
                      - statusCode: '2003'
                        statusName: COLLECTED
                        data:
                          comment: Recolectada por el veloz Don veloz Base dd9932d
                        metadata: {}
                        createdAt: '2021-12-20 11:03:58'
                      - statusCode: '3001'
                        statusName: STORED
                        data:
                          comment: En estación MX2 por módulo de inducción
                        metadata: {}
                        createdAt: '2021-12-20 16:10:41'
                      - statusCode: '3004'
                        statusName: ON_LINEHAUL
                        data:
                          milleSegment: middle
                          comment: En camino a estación Toluca desde estación Tultitlán por operarios.tultitlan el número de orden 2727370887
                        metadata: {}
                        createdAt: '2021-12-20 16:36:01'
                      - statusCode: '3001'
                        statusName: STORED
                        data:
                          location: station
                          milleSegment: first
                          comment: Cambiado a la estación por jose.delgado el número de orden 2727370887
                        metadata: {}
                        createdAt: '2021-12-21 08:12:21'
                      - statusCode: '3001'
                        statusName: STORED
                        data:
                          location: station
                          milleSegment: first
                          comment: Cambiado a la estación por jose.delgado el número de orden 2727370887
                        metadata: {}
                        createdAt: '2021-12-21 08:13:48'
                      - statusCode: '4001'
                        statusName: ON_ROAD_TO_DELIVERY
                        data:
                          attempt: 1
                          comment: Auto-rea-asignada por el veloz Don veloz GUI TOL 65829
                        metadata: {}
                        createdAt: '2021-12-21 08:25:59'
                      - statusCode: '4001'
                        statusName: ON_ROAD_TO_DELIVERY
                        data:
                          attempt: 1
                          comment: Auto-rea-asignada por el veloz Don veloz GUI TOL 65829
