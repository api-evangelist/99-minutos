openapi: 3.0.3
info:
  title: API Version 3 coverage locations API
  version: 3.0.0
  description: "This is the documentation for the public api *(version 3)* of 99minutos. [https://www.99minutos.com/.](https://www.99minutos.com/.EnvironmentAPI)\n\n# First Steps\n\n1.  Create an account in the sandbox website: [https://delivery-git-sandbox-99minutos.vercel.app/](https://delivery-git-sandbox-99minutos.vercel.app/)\n2.  Go to Developers section\n3.  On API Keys V3 section click on `Generar`\n4.  After this the `client_id` and `client_secret` will be displayed\n    \n\nUse the credentials to generate access tokens as shown below in the endpoint `create access token`\n\nFollow the same process in production.\n\n## Environments\n\n| **Environment** | **Website** | **API url** |\n| --- | --- | --- |\n| Sandbox | [https://delivery-git-sandbox-99minutos.vercel.app/](https://delivery-git-sandbox-99minutos.vercel.app/) | [https://sandbox.99minutos.com](https://sandbox.99minutos.com) |\n| Production | [https://envios.99minutos.com/developers](https://envios.99minutos.com/developers) | [https://delivery.99minutos.com](https://delivery.99minutos.com) |\n\n`Each environment has an independent set of credentials`"
servers:
- url: https://delivery.99minutos.com
  description: Produccion
- url: https://sandbox.99minutos.com
  description: Sandbox Environment
tags:
- name: locations
paths:
  /api/v3/locations:
    post:
      operationId: locations_create
      description: Get the location id of a given address Through this endpoint you can exchange an address for a location id. The purpose of this exchange is that later, in a second request, you can include the location id as origin or destination to create an order. Using this flow you won't need to include any more information and you can always reuse the location id for that point.
      tags:
      - locations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewLocation'
            examples:
              LocationPayloadExample:
                value:
                  addresses:
                  - Calle Zoquipa 196, El Parque, Venustiano Carranza, 15960 Ciudad de México, CDMX, México
                  - Calle del Correo Mayor 112, Centro, Cuauhtémoc, Ciudad de México, CDMX, México
                  city: Cuauhtémoc
                  country: MEX
                summary: Location payload example
                description: Location payload.
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NewLocation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NewLocation'
        required: true
      security:
      - AuthJWT: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationsResponse'
              examples:
                LocationResponse:
                  value:
                    traceId: ec1d12ad-48dc-4628-99a5-0db1cc8b2bba
                    message: OK
                    data:
                    - address: Calle Zoquipa 196, El Parque, Venustiano Carranza, 15960 Ciudad de México, CDMX, Mexico
                      latitude: '19.417688'
                      longitude: '-99.118484'
                      locationId: 3aefcb54-698f-43e9-9b1f-252ac72f6cfd
                      locationType: private
                      geoType: ROOFTOP
                    - address: Calle del Correo Mayor 112, Centro Histórico de la Cdad. de México, Centro, Cuauhtémoc, 06090 Ciudad de México, CDMX, Mexico
                      latitude: '19.427275'
                      longitude: '-99.13072'
                      locationId: 04639da9-63f4-40ab-a8c3-8fff2f2509e3
                      locationType: private
                      geoType: ROOFTOP
                    errors: {}
                  summary: Location response
                  description: Location response
          description: ''
