components:
  schemas:
    NearestRequest:
      type: object
      properties:
        address:
          type: string
          description: String address of the location
        includeP99:
          type: boolean
          description: p99 represents the network of point99. If you set it to true, the nearests p99 place locations will be returned. Otherwise, only will be returned the location according to the giving address.
        distance:
          type: integer
          maximum: 20000
          minimum: 0
          default: 5000
          description: Maximum distance in meters between the given direction and the nearest p99
        city:
          type: string
          description: City of the address
        country:
          type: string
          description: Country of the address
      required:
      - address
      - city
      - country
      x-examples:
        example-1:
          address: string
          includeP99: true
          distance: 5000
          city: string
          country: string
    NearestList:
      type: object
      properties:
        description:
          type: string
          description: Description of the location
        address:
          type: string
          description: String address of the location
        latitude:
          type: string
          description: Lattitude of the location
        longitude:
          type: string
          description: Longitude of the location
        locationId:
          type: string
          format: uuid
          description: Unique uuid for the location. This id can be used to refer an origin or destination in the order creation endpoint.
        locationType:
          allOf:
          - $ref: '#/components/schemas/LocationTypeEnum'
        distance:
          type: number
          format: double
          description: Distance to the given address.
        zipcode:
          type: string
          description: Zipcode address
      required:
      - description
      - address
      - latitude
      - longitude
      - locationId
      - locationType
      - distance
      - zipcode
