      properties:
        deliveryType:
          type: string
          description: 'Delivery type code. Supported values: SMD (SameDay), NXD (NextDay), SPT (Sprint, auto-converted to NXD), 99M, CO2, RET, ECO, P2P, NAL, XBD.'
          enum:
          - SMD
          - NXD
          - SPT
          - 99M
          - CO2
          - RET
          - ECO
          - P2P
          - NAL
          - XBD
        packageSize:
          type: string
          description: General package size for the order.
          enum:
          - xs
          - s
          - m
          - l
          - xl
          - xxl
        origin:
          $ref: '#/components/schemas/MultiboxLocation'
        destination:
          $ref: '#/components/schemas/MultiboxLocation'
        sender:
