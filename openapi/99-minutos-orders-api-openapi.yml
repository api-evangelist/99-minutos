      example:
        errors:
        - Error on CustomerProfileService
        traceId: 5e011b32-000f-4896-8aaf-34d7a8f85960
        code: 400
    MultiboxErrorItem:
      type: object
      description: 'Individual error item returned by the multibox endpoint.


        Possible error codes:

        - GENERIC_INVALID_PARAMETERS (422): Validation error on request fields

        - INTERNAL_KEY_ALREADY_EXISTS (422): The internalKey was already used

        - CUSTOMER_INACTIVE (422): Customer is not active

        - ORGANIZATION_INACTIVE (422): Customer organization is not active

        - CUSTOMER_HAS_NO_CREDIT (422): Customer has no credit available

        - CUSTOMER_DELIVERY_TYPE_NOT_ACTIVE (422): Delivery type not enabled for the customer

        - GEOCODING_SERVICE_ERROR (500): Geocoding service failure

        - COVERAGE_SERVICE_ERROR (500): Coverage validation failure

        - SHIPPING_RATES_SERVICE_ERROR (varies): Shipping rates service error

        - TRACKING_ID_SERVICE_ERROR (500): Tracking ID generation failure

        - STATE_MACHINE_ERROR_RESPONSE (500/varies): State machine processing error

        - CUSTOMERS_V3_SERVICE_ERROR (500): Customer service error

        - FAILED_TO_CREATE_REQUEST (500): Could not build internal HTTP request

        - FAILED_TO_SEND_REQUEST (500): Internal HTTP request failed

        - FAILED_TO_DECODE_RESPONSE (500): Could not decode internal service response

        - JWT_EXPIRED (401): JWT token has expired

        - FAILED_TO_RETRIEVE_USER_DATA (500): Could not extract user data from JWT

        - GENERIC_500_ERROR (500): Uncategorized internal server error'
      properties:
        code:
          type: string
          description: Error code identifier.
          enum:
          - GENERIC_INVALID_PARAMETERS
          - INTERNAL_KEY_ALREADY_EXISTS
          - CUSTOMER_INACTIVE
          - ORGANIZATION_INACTIVE
          - CUSTOMER_HAS_NO_CREDIT
          - CUSTOMER_DELIVERY_TYPE_NOT_ACTIVE
          - GEOCODING_SERVICE_ERROR
          - COVERAGE_SERVICE_ERROR
          - SHIPPING_RATES_SERVICE_ERROR
          - TRACKING_ID_SERVICE_ERROR
          - STATE_MACHINE_ERROR_RESPONSE
          - CUSTOMERS_V3_SERVICE_ERROR
          - FAILED_TO_CREATE_REQUEST
          - FAILED_TO_SEND_REQUEST
          - FAILED_TO_DECODE_RESPONSE
          - JWT_EXPIRED
          - FAILED_TO_RETRIEVE_USER_DATA
          - GENERIC_500_ERROR
        message:
          type: string
          description: Human-readable error description.
        field:
          type: string
          description: Field name that caused the error (only present for validation errors).
      required:
      - code
      - message
    MigratedByEnum:
      enum:
      - stream
      - batch
      type: string
    Location:
      type: object
      description: 'Location where the package is picked up.

        Depending on the flow you choose,

        you must send different parameters.


        A location is a geographical point that can be taken as the origin and/or destination of a shipment.


        There are 3 ways in which you can define a location, feel free to choose the one that best suits your business rules.

        Each one is described below.


        1. Coords-based

        It is the option with the best precision to define an origin or destination.

        Latitude and longitude are taken to define the location


        2. LocationId-based

        A LocationId is a uuid that identifies a single geographic point.

        The locationId is generated by this API (check out the Get Location id request in Locations folder).

        By using locationId, no further data needs to be passed.

        It is useful when you have the same point in several shipments since you can reuse the locationId.


        3. Address string-based

        In this option the client sends only the address. We will process the address to obtain the other data.


        However, if the address does not contain information necessary to locate it,

        the system will return a 400 error and the order will not be created, so you must handle the error.


        It is important to emphasize that in the two previous flows there is no possibility to reject an order for the location'
      properties:
        locationId:
          type: string
          format: uuid
          description: LocationId is a uuid that identifies a single geographic point.
        lat:
          type: number
          format: double
          maximum: 90
          minimum: -90
          description: Longitude coordinates
        lng:
          type: number
          format: double
          maximum: 180
          minimum: -180
          description: Lattitude coordinates
        address:
          type: string
          description: Text sentence that references the location. This address will be printed on the labels.
        country:
          allOf:
          - $ref: '#/components/schemas/LocationCountryEnum'
        reference:
          type: string
          description: Any other text that enrich the address of the location such apartment, Suite, Box number, Tower, etc.
        zipcode:
          type: string
          description: Location zipcode. If it is not included we will try to extract the zipcode from the address. So if your address does not include zipcode, you must include it in this field
          nullable: true
        city:
          type: string
          description: Text that reference the city of the location
    Item:
      type: object
      description: Array of items/packages to send.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        size:
          $ref: '#/components/schemas/ItemSizeEnum'
        description:
          type: string
        weight:
          type: integer
          minimum: 1
          description: Measurement in grams of weight
        length:
          type: integer
          minimum: 1
          description: Horizontal measurement in centimeters take from one end to the other of the longer or longest side of an object
        width:
          type: integer
          minimum: 1
          description: Horizontal measurement in centimeters taken from one end to the other of theshorter or shortest side of an object
        height:
          type: integer
          minimum: 1
          description: Vertical measure in centimeters of distance from base to top
      required:
      - id
      - size
      - weight
