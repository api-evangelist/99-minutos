aid: 99-minutos
name: 99 Minutos
description: 99minutos (99 Minutos) is a Latin American last-mile logistics and delivery platform serving
  ecommerce businesses across Mexico, Chile, Colombia and Peru. It offers express parcel delivery (envios99),
  full-truck-load and drayage freight (freight99), fulfillment and warehousing (fulfill99) and custom
  logistics operations (tailor99), backed by a network of pickup/delivery points (Punto99). Its public
  REST API v3 lets developers resolve addresses to reusable location ids, quote shipping rates and coverage,
  create/confirm orders (including multibox), print PDF and ZPL labels, track shipments and subscribe
  to real-time status webhooks. Authentication is OAuth2 client-credentials that returns a bearer JWT.
  Surfaced as a 500 Global portfolio company and enriched by the API Evangelist pipeline from the provider's
  own developer portal.
